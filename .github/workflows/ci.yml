name: CI

on:
  pull_request:
    branches: [develop, main, 'release/**']
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  ci-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check branch flow
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [[ "$BASE" == main ]]; then
            [[ "$HEAD" == release/* || "$HEAD" == hotfix/* ]]
          elif [[ "$BASE" == develop ]]; then
            [[ "$HEAD" == feature/* || "$HEAD" == docs/* || "$HEAD" == test/* || "$HEAD" == release/* || "$HEAD" == hotfix/* || "$HEAD" == backport/* ]]
          elif [[ "$BASE" == release/* ]]; then
            [[ "$HEAD" == release-fix/* || "$HEAD" == hotfix/* || "$HEAD" == backport/* ]]
          else
            exit 1
          fi
      - run: python scripts/check_docs.py

  ci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.lock ruff==0.17.0
      - run: python -m ruff check backend tests scripts
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend

  ci-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m unittest discover -s tests -v
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  ci-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  ci-grader:
    if: github.base_ref == 'main' || startsWith(github.base_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Logisim 5.0.0 的 --test-vector 路径会构造 Swing 菜单栏，headless 下必抛
      # HeadlessException；必须用虚拟显示，不能加 -Djava.awt.headless=true。
      - name: Install virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - run: python -m pip install -r backend/requirements.lock
      - name: Download and verify fixed Logisim JAR
        env:
          JAR_SHA256: 6b368e894742c04cc83aa9830f869bcab0190ede4df43ad6fecdb89b3a23a41c
        run: |
          curl -fsSL --retry 3 -o /tmp/logisim.jar \
            "https://github.com/${{ github.repository }}/releases/download/grader-jar-5.0.0/logisim-evolution-5.0.0-all.jar"
          echo "${JAR_SHA256}  /tmp/logisim.jar" | sha256sum -c -
      - name: Real Logisim engine smoke test
        run: xvfb-run -a env LOGISIM_JAR_PATH=/tmp/logisim.jar python scripts/ci_grader_smoke.py

  ci-required:
    if: always()
    needs: [ci-policy, ci-lint, ci-test, ci-build, ci-grader]
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs for this target branch
        env:
          POLICY: ${{ needs.ci-policy.result }}
          LINT: ${{ needs.ci-lint.result }}
          TEST: ${{ needs.ci-test.result }}
          BUILD: ${{ needs.ci-build.result }}
          GRADER: ${{ needs.ci-grader.result }}
          BASE: ${{ github.base_ref }}
        run: |
          if [[ "$POLICY" != success || "$LINT" != success || "$TEST" != success || "$BUILD" != success ]]; then
            echo "Required job failed: policy=$POLICY lint=$LINT test=$TEST build=$BUILD"
            exit 1
          fi
          if [[ "$BASE" == main || "$BASE" == release/* ]]; then
            if [[ "$GRADER" != success ]]; then
              echo "Release grader check failed: grader=$GRADER"
              exit 1
            fi
          fi
